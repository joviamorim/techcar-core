services:
  db:
    image: postgres:16
    container_name: techcar-core-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - techcar_core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  techcar_core_pgdata: